name: Release MangaYun

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > signingkey.jks
          chmod 600 signingkey.jks
      - name: Build arm64 release APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:zh:mangayun:lintRelease :src:zh:mangayun:assembleRelease --no-daemon

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mangayun-release-apk
          path: src/zh/mangayun/build/outputs/apk/release/*.apk

      - name: Package source archive
        shell: bash
        run: |
          git archive --format=zip --output=source.zip HEAD
          test -s source.zip

      - name: Publish release and retain latest three
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src/zh/mangayun/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" = "v1.6.11" ]; then
            notes="## MangaYun 1.6.11\n\n### 更新内容\n\n- 修复 Hamreus 章节图片 Referer，缓解图片加载 HTTP 403。\n- 保持 MangaYun 详情、章节和签名接口兼容。"
          elif [ "$tag" = "v1.6.10" ]; then
            notes="## MangaYun 1.6.10\n\n### 更新内容\n\n- 适配 mangayun.com 当前新版 SPA 接口。\n- 新增热门和最新漫画列表。\n- 修复封面加载，支持 MangaYun 图片代理。\n- 修复 DM5 图片 Referer，提升封面和章节图片加载成功率。\n- 适配新版 /m/<key> 漫画详情路由。\n- 兼容新版 JSON key，同时保留旧版 key 解析。\n- 补齐搜索站点错误、额外字段和章节更新时间字段。\n- 保持现有签名算法和章节图片接口兼容。"
          else
            prev_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -z "$prev_tag" ]; then
              notes="## 更新内容\n\n- 初始版本"
            else
              log="$(git log "$prev_tag"..HEAD --oneline --format='%s')"
              new="$(echo "$log" | grep -E '^feat' | sed 's/^feat: */  /')"
              fixes="$(echo "$log" | grep -E '^fix' | sed 's/^fix: */  /')"
              perf="$(echo "$log" | grep -E '^perf' | sed 's/^perf[^:]*: */  /')"
              chore="$(echo "$log" | grep -E '^(chore|ci|docs)' | sed 's/^[a-z]*: */  /')"
              notes=""
              [ -n "$new" ]   && notes+="🚀 新功能\n$new\n\n"
              [ -n "$perf" ]  && notes+="⚡ 性能优化\n$perf\n\n"
              [ -n "$fixes" ] && notes+="🐛 修复\n$fixes\n\n"
              [ -n "$chore" ] && notes+="🔧 杂项\n$chore\n\n"
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            old_apk="$(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".apk"))' | head -n1 || true)"
            [ -z "$old_apk" ] || gh release delete-asset "$tag" "$old_apk" --yes
            gh release upload "$tag" "$apk" source.zip --clobber
            gh release edit "$tag" --title "$tag" --notes "$(echo -e "$notes")"
          else
            gh release create "$tag" "$apk" source.zip --title "$tag" --notes "$(echo -e "$notes")"
          fi
          mapfile -t old_releases < <(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:][] | .tagName')
          for old_tag in "${old_releases[@]}"; do
            gh release delete "$old_tag" --yes --cleanup-tag 2>/dev/null || true
          done
